{% extends "base.html" %}
{% block content %}
<form method="post" action="/decide" class="card">
  <h2>What should I do?</h2>

  <select name="stage" required>
    <option value="">Your stage</option>
    <option>School</option>
    <option>College</option>
    <option>Graduate</option>
    <option>Career Switch</option>
  </select>

  <textarea name="problem" required placeholder="Explain your confusion..."></textarea>

  <button>Help me decide</button>
</form>
{% endblock %}
