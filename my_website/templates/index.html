{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<h1>Add Post</h1>

<form action="/create"
method="POST">
<input type="text"
name="title" placeholder="Title"required>
<textarea name="content"
placeholder="Write something..."
required></textarea>
<button type="submit">post</button>
</form>

{% for post in posts %}
<div class="post">
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
</div>

</div>
{% endfor %}

{% endblock %}
