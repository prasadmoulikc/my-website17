<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
<title>NextStep AI</title>
</head>

<body>
<div class="card">

<h1>✨ NextStep AI</h1>
<p>Make calm, confident decisions about your future.</p>

<div class="quick">
  <button onclick="fill('How should I plan for exams?')">📘 Exam Stress</button>
  <button onclick="fill('Which career suits me?')">🧭 Career Choice</button>
  <button onclick="fill('How do I choose my future?')">🚀 Future</button>
  <button onclick="fill('How can I improve myself?')">🛠 Growth</button>
</div>

<form method="POST" action="/ask">
  <input id="q" name="question" placeholder="Ask your question..." required>

  <select name="mood">
    <option>Calm</option>
    <option>Confused</option>
    <option>Stressed</option>
    <option>Motivated</option>
  </select>

  <button type="submit">Ask AI</button>
</form>

</div>

<script>
function fill(text){
  document.getElementById("q").value = text;
}
</script>

</body>
</html>
